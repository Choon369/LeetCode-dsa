name: Sync LeetCode Submissions

on:
  workflow_dispatch: # Allows you to run the script manually anytime
  schedule:
    - cron: '0 8 * * *' # Runs automatically every single day at 8:00 AM UTC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Sync LeetCode history
        uses: joshcai/leetcode-sync@v1.7
        with:
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: my-submissions
          verbose: true
